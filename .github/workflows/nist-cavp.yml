name: NIST CAVP Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  nist-cavp-verify:
    name: NIST CAVP Test Vectors
    runs-on: ubuntu-latest
    container: rust:latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Download NIST CAVP test vectors
        run: |
          mkdir -p tests/nist_cavp
          curl -L -o tests/nist_cavp/gcmtestvectors.zip \
            "https://csrc.nist.gov/CSRC/media/Projects/Cryptographic-Algorithm-Validation-Program/documents/mac/gcmtestvectors.zip"
          unzip tests/nist_cavp/gcmtestvectors.zip -d tests/nist_cavp/

      - name: Build library
        run: cargo build --lib --no-default-features --features "post-quantum compression ctrlc"

      - name: Run NIST CAVP AES-256-GCM tests
        run: |
          echo "::group::NIST CAVP AES-256-GCM Tests"
          cargo test --test nist_cavp_tests --no-default-features --features "post-quantum compression ctrlc" -- --nocapture
          echo "::endgroup::"
