name: Wycheproof Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  wycheproof-verify:
    name: Wycheproof Cryptographic Test Vectors
    runs-on: ubuntu-latest
    container: rust:latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates git

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Clone Wycheproof test vectors
        run: |
          git clone --depth 1 https://github.com/C2SP/wycheproof.git tests/wycheproof

      - name: Build library
        run: cargo build --lib --no-default-features --features "post-quantum compression ctrlc"

      - name: Run Wycheproof AES-GCM tests
        run: |
          echo "::group::Wycheproof AES-GCM Tests"
          cargo test --test wycheproof_tests --no-default-features --features "post-quantum compression ctrlc" -- --nocapture
          echo "::endgroup::"
